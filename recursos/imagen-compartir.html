<!doctype html>
<!--
  Fuente de compartir.png (vista previa al pegar el enlace en redes y chats).
  Para regenerarla:
  chrome --headless --hide-scrollbars --window-size=1200,630 --virtual-time-budget=6000 --screenshot=compartir.png recursos/imagen-compartir.html
-->
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@500&family=Noto+Sans+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: 'Bricolage Grotesque', 'Noto Sans SC', sans-serif; color: #1d1a16;
    background-color: #f3ead8;
    background-image: radial-gradient(rgba(29, 26, 22, .14) 1.5px, transparent 1.8px);
    background-size: 24px 24px;
  }
  .blob { position: absolute; border: 4px solid #1d1a16; }
  .b1 { width: 300px; height: 300px; border-radius: 50%; background: #ffc93c; right: -90px; top: -110px; }
  .b2 { width: 170px; height: 170px; border-radius: 34px; background: #2f4bff; left: -60px; bottom: -50px; transform: rotate(18deg); }
  .b3 { width: 120px; height: 120px; border-radius: 50% 50% 10px 50%; background: #ff9fcb; right: 390px; bottom: -64px; transform: rotate(-12deg); }

  .wrap { position: absolute; inset: 0; padding: 54px 70px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .mark { position: relative; width: 66px; height: 46px; }
  .mark i { position: absolute; top: 0; width: 46px; height: 46px; border-radius: 50%; border: 4px solid #1d1a16; }
  .mark i:first-child { left: 0; background: #ff5b3a; }
  .mark i:last-child { left: 20px; background: #2f4bff; mix-blend-mode: multiply; }
  .brand b { font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
  .brand span { font-family: 'Noto Sans SC', sans-serif; font-weight: 700; font-size: 26px; color: #4a443b; margin-left: 6px; }

  h1 { margin-top: 40px; font-size: 76px; font-weight: 800; line-height: 1; letter-spacing: -.035em; max-width: 900px; }
  h1 em {
    font-style: normal; display: inline-block; background: #ffc93c; padding: 0 .14em;
    border: 4px solid #1d1a16; border-radius: 16px; box-shadow: 6px 6px 0 #1d1a16; transform: rotate(-2.5deg);
  }
  .zh { margin-top: 26px; font-family: 'Noto Sans SC', sans-serif; font-weight: 900; font-size: 38px; }

  .row { margin-top: auto; display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 800; }
  .w { background: #fffdf8; border: 4px solid #1d1a16; border-radius: 14px; padding: 4px 18px; box-shadow: 4px 4px 0 #1d1a16; }
  .w.win { background: #ffc93c; }
  .arrow { color: #4a443b; }
  .cta {
    margin-left: auto; background: #ff5b3a; border: 4px solid #1d1a16; border-radius: 16px; box-shadow: 6px 6px 0 #1d1a16;
    padding: 12px 26px; font-size: 30px; transform: rotate(-2deg);
  }
</style>
</head>
<body>
  <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
  <div class="wrap">
    <div class="brand">
      <span class="mark"><i></i><i></i></span>
      <b>Misma Palabra</b><span>· 想到一块儿</span>
    </div>
    <h1>¿En qué ronda pensaréis la <em>misma</em> palabra?</h1>
    <p class="zh">你们会在第几轮想到同一个词？</p>
    <div class="row">
      <span class="w">playa</span><span class="w">nieve</span>
      <span class="arrow">→</span>
      <span class="w win">invierno</span>
      <span class="cta">¡Juega gratis!</span>
    </div>
  </div>
</body>
</html>
