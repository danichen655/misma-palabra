<!doctype html>
<!--
  Página de prueba para elegir la música de fondo. No se publica (no está en dist/).
  Ábrela con la web local en marcha: npm run web → http://localhost:4321/recursos/musica-demo.html
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elegir música · Same Word</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../estilo.css">
  <style>
    .demo { max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }
    .demo h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 10px 0 8px; }
    .demo > .sub { margin-bottom: 26px; }
    .options { display: grid; gap: 16px; }
    .option {
      display: flex; align-items: center; gap: 16px; text-align: left; width: 100%;
      font: inherit; color: var(--ink); background: var(--white); border: var(--line); border-radius: 18px;
      box-shadow: var(--shadow-sm); padding: 16px 18px; cursor: pointer; transition: transform .08s, box-shadow .08s;
    }
    .option:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
    .option[aria-pressed="true"] { background: var(--mustard); }
    .option .num {
      display: grid; place-items: center; width: 48px; height: 48px; flex: none; border: var(--line); border-radius: 50%;
      font-weight: 800; font-size: 1.3rem; background: var(--paper);
    }
    .option[aria-pressed="true"] .num { background: var(--ink); color: var(--mustard); }
    .option b { display: block; font-size: 1.2rem; }
    .option small { display: block; color: var(--ink-2); font-size: .92rem; margin-top: 2px; }
    .option .state { margin-left: auto; font-weight: 800; font-size: .85rem; white-space: nowrap; }
    .stop { margin-top: 22px; }
  </style>
</head>
<body>
  <main class="demo">
    <span class="sticker pink">Solo para elegir · no está en la web</span>
    <h1>¿Qué música te gusta?</h1>
    <p class="sub">Pulsa una opción para escucharla (sube el volumen). Puedes cambiar de una a otra sin parar.</p>

    <div class="options">
      <button class="option" type="button" data-style="relajante" aria-pressed="false">
        <span class="num">1</span>
        <span><b>Relajante</b><small>Acordes suaves y notas de caja de música. Tranquila y luminosa.</small></span>
        <span class="state"></span>
      </button>
      <button class="option" type="button" data-style="lofi" aria-pressed="false">
        <span class="num">2</span>
        <span><b>Lo-fi</b><small>Piano eléctrico cálido, ritmo muy lento y crujido de vinilo.</small></span>
        <span class="state"></span>
      </button>
      <button class="option" type="button" data-style="intriga" aria-pressed="false">
        <span class="num">3</span>
        <span><b>Intriga</b><small>Tono menor, bordón grave, reloj que hace tic-tac y notas pellizcadas.</small></span>
        <span class="state"></span>
      </button>
      <button class="option" type="button" data-style="espacial" aria-pressed="false">
        <span class="num">4</span>
        <span><b>Espacial</b><small>Acordes muy aireados, destellos agudos y mucha reverberación, sin ritmo.</small></span>
        <span class="state"></span>
      </button>
    </div>

    <button class="btn dark stop" id="stop" type="button">■ Parar</button>
  </main>

  <script type="module">
    import { createMusic } from '../musica.js';

    let music = null;
    const options = document.querySelectorAll('.option');

    function paint(current) {
      for (const option of options) {
        const on = option.dataset.style === current;
        option.setAttribute('aria-pressed', String(on));
        option.querySelector('.state').textContent = on ? '♪ sonando' : '▶ escuchar';
      }
    }

    for (const option of options) {
      option.addEventListener('click', () => {
        const style = option.dataset.style;
        if (!music) music = createMusic(style);
        else music.setStyle(style);
        music.start();
        paint(style);
      });
    }

    document.querySelector('#stop').addEventListener('click', () => {
      music?.stop();
      paint(null);
    });

    paint(null);
  </script>
</body>
</html>
